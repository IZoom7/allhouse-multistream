<!doctype html>
<!-- Share card (Open Graph / Twitter / Discord / LINE / Facebook) rendered to docs-site/assets/og-cover.png by scripts/build-og-image.cjs. 1200×630. -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@500;600&family=Press+Start+2P&family=VT323&display=block">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #0d0f1a; }
  .card { position: relative; width: 1200px; height: 630px; overflow: hidden;
    background: radial-gradient(700px 420px at 900px 250px, #4a2380 0%, #0000 70%), linear-gradient(180deg, #0b0c18 0%, #1a1440 55%, #2a1650 80%, #3a1a4a 100%); }
  .stars { position: absolute; inset: 0; }
  .skyline { position: absolute; left: 0; right: 0; bottom: 34px; height: 150px; background: url(../docs-site/assets/pixel/skyline.svg) repeat-x bottom left / auto 100%; }
  .ground { position: absolute; left: 0; right: 0; bottom: 0; height: 34px; background: repeating-linear-gradient(90deg, #2a2340 0 16px, #241e38 16px 32px); border-top: 4px solid #000; }
  .stripe { position: absolute; left: 0; right: 0; top: 0; height: 10px; background: linear-gradient(90deg, #285bb5 0 25%, #bd3933 25% 50%, #f0cb45 50% 75%, #287b49 75%); }
  .copy { position: absolute; left: 70px; top: 78px; width: 640px; }
  .coin { display: flex; align-items: center; gap: 12px; font: 16px 'Press Start 2P'; color: #f0cb45; letter-spacing: .1em; }
  .coin img { width: 26px; image-rendering: pixelated; }
  h1 { margin: 26px 0 22px; font: 76px/1 'Press Start 2P'; color: #fff5dd; text-shadow: 5px 5px 0 #bd3933, 10px 10px 0 #000; position: relative; }
  h1::before { content: 'ALLHOUSE'; position: absolute; inset: 0; color: #2bc3e0; clip-path: inset(0 0 62% 0); transform: translate(-4px, 0); opacity: .8; text-shadow: none; }
  .tag { font: 600 38px/1.25 'Mitr'; color: #fff5dd; }
  .tag b { color: #f0cb45; font-weight: 600; }
  .en { margin-top: 10px; font: 29px/1.2 'VT323'; color: #cfc6e8; letter-spacing: .02em; }
  .plats { display: flex; gap: 12px; margin-top: 26px; }
  .pt { width: 54px; height: 54px; border-radius: 10px; border: 3px solid #000; display: grid; place-items: center; box-shadow: inset 0 3px 0 #ffffff40, 0 5px 0 #000; }
  .pt svg { width: 28px; height: 28px; fill: currentColor; }
  .chip { align-self: center; margin-left: 10px; font: 13px 'Press Start 2P'; color: #53c26b; border: 3px solid #53c26b; padding: 10px 12px; border-radius: 4px; background: #0008; }
  .art { position: absolute; right: 60px; top: 70px; width: 420px; height: 420px; }
  .halo { position: absolute; inset: 30px; border-radius: 50%; background: radial-gradient(circle, #f0cb4559, #e62eb42e 45%, #0000 70%); }
  .house { position: absolute; left: 70px; top: 50px; width: 280px; image-rendering: pixelated; filter: drop-shadow(0 0 34px #f0cb4566); }
  .shadow { position: absolute; left: 120px; top: 360px; width: 180px; height: 18px; border-radius: 50%; background: #0009; }
  .sp { position: absolute; image-rendering: pixelated; }
  .puff { position: absolute; background: #fff5dd; border: 2px solid #514738; }
  .scan { position: absolute; inset: 0; background: repeating-linear-gradient(0deg, #0000 0 2px, #0000002e 2px 3px); pointer-events: none; }
  .url { position: absolute; right: 40px; bottom: 50px; font: 14px 'Press Start 2P'; color: #fff5dd; background: #bd3933; border: 3px solid #000; padding: 10px 14px; box-shadow: 0 5px 0 #000; }
</style></head>
<body><div class="card">

  <div class="scan"></div>
</div>
<script>
  // Seeded starfield so every build looks the same.
  const c = document.querySelector('.stars').getContext('2d'); let s = 11; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const cols = ['#fff5dd', '#f0cb45', '#5aa0ff', '#efa39a'];
  for (let i = 0; i < 260; i++) { const x = Math.round(r() * 1200), y = Math.round(r() * 470), z = r() < .12 ? 3 : 2; c.globalAlpha = .4 + r() * .6; c.fillStyle = cols[i % 4]; c.fillRect(x, y, z, z);
    if (z === 3 && r() > .5) { c.fillRect(x - 3, y + 1, 9, 1); c.fillRect(x + 1, y - 3, 1, 9); } }
</script>
</body></html>
